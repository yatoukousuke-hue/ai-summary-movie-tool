services:
  - type: web
    name: ai-summary-movie-tool
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_AI_ANALYSIS
        value: "false"
      - key: RETURN_VIDEO_DATA_URL
        value: "true"
      - key: FILE_RETENTION_HOURS
        value: "24"
      - key: APP_ACCESS_PASSWORD
        sync: false
